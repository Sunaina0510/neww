name: Build and deploy a container to kubernetes

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop  

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b

      - name: Log in to Dockerhub
        uses: docker/login-action@8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d
        with:
          username: ${{ DOCKER_USERNAME }}
          password: ${{ DOCKER_PASSWORD }}

      - name: Build and push container image to dockerhub
        uses: docker/build-push-action@9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f
        run: |
          docker tag singlestage:latest ${{ secrets.DOCKER_USERNAME }}/singlestage:latest
          docker tag multistage:latest ${{ secrets.DOCKER_USERNAME }}/multistage:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/singlestage:latest 
          docker push ${{ secrets.DOCKER_USERNAME }}/multistage:latest

  deploy:
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set minikube
        run : minikube start

      - name: deploy to kubernetes
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml
